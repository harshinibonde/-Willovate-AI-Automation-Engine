<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email - Willovate CRM</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 22px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Send Email</h1>

        <form method="POST" action="/email">
            <label for="recipient">Recipient</label>
            <input
                type="text"
                id="recipient"
                name="recipient"
                placeholder="Recipient"
                required
            >

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Subject"
                required
            >

            <label for="email-body">Message</label>
            <textarea
                id="email-body"
                name="body"
                placeholder="Write your message..."
                required
            ></textarea>

            <button
                type="submit"
                id="send-email"
            >
                Send Email
            </button>
        </form>
    </div>
</body>
</html>
